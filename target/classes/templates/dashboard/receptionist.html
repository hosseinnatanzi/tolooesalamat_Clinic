<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دسترسی غیرمجاز</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-card {
            background: white;
            border-radius: 24px;
            padding: 60px 40px;
            text-align: center;
            max-width: 480px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
        }
        .error-icon {
            font-size: 80px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 32px;
            color: #1e293b;
            margin-bottom: 12px;
        }
        p {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 12px 28px;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body>
<div class="error-card">
    <div class="error-icon">🚫</div>
    <h1>دسترسی غیرمجاز</h1>
    <p>
        شما به این بخش دسترسی ندارید. لطفاً با مدیر سیستم تماس بگیرید
        یا به داشبورد خود بازگردید.
    </p>
    <a href="/dashboard" class="btn">بازگشت به داشبورد</a>
</div>
</body>
</html>
