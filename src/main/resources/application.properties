# ═══════════════════════════════════════════════════════════
# 🏥 Clinic Application Properties
# ═══════════════════════════════════════════════════════════

# ═══════════ Application ═══════════
spring.application.name=clinic-app
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ═══════════ Database - Clinic_database ═══════════
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:Clinic_database}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:25392552}
spring.datasource.driver-class-name=org.postgresql.Driver

# ═══════════ HikariCP ═══════════
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=ClinicHikariPool

# ═══════════ JPA / Hibernate ═══════════
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.open-in-view=false

# ═══════════ Thymeleaf ═══════════
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ═══════════ Server ═══════════
server.port=${APP_PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.error.whitelabel.enabled=false

# ═══════════ Crypto / RSA ═══════════
app.crypto.public-key-path=classpath:keys/app-public.pem
app.crypto.private-key-path=classpath:keys/app-private-encrypted.pem
app.crypto.private-key-password=${RSA_PRIVATE_KEY_PASSWORD}
app.crypto.rsa-algorithm=RSA/ECB/OAEPWithSHA-256AndMGF1Padding
app.crypto.aes-algorithm=AES/GCM/NoPadding
app.crypto.aes-key-size=256
app.crypto.iv-length=12
app.crypto.gcm-tag-length=128
app.crypto.signature-algorithm=SHA256withRSA

# ═══════════ JWT ═══════════
app.jwt.issuer=clinic-app
app.jwt.audience=clinic-users
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
app.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:1}
app.jwt.header=Authorization
app.jwt.prefix=Bearer 
app.jwt.clock-skew-seconds=30

# ═══════════ Swagger / OpenAPI ═══════════
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.packages-to-scan=ir.tolooesalamat.app.controller
springdoc.paths-to-match=/api/**

# ═══════════ Logging ═══════════
logging.level.root=INFO
logging.level.ir.tolooesalamat=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.file.name=logs/clinic-app.log